name: Morning Weather

on:
  schedule:
    # 04:00 MSK = 01:00 UTC
    - cron: '0 1 * * *'
  
  # Кнопка для ручного запуска в Actions
  workflow_dispatch:

jobs:
  send-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run Weather Bot
        env:
          WEATHER_TG_BOT_TOKEN: ${{ secrets.WEATHER_TG_BOT_TOKEN }}
          WEATHER_TG_CHAT_ID: ${{ secrets.WEATHER_TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.WEATHER_TG_BOT_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.WEATHER_TG_CHAT_ID || secrets.TG_CHAT_ID }}
        run: python weather_bot.py

