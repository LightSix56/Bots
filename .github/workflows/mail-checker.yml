name: Mail Checker Bot

on:
  schedule:
    # Раз в час, со сдвигом от начала часа (GitHub рекомендует избегать минуты 0
    # из-за перегрузки в пиковые моменты). ~720 запусков/мес, бюджет с запасом.
    - cron: '7 * * * *'
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  check-mail:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run mail checker
      env:
        MAIL_USER: ${{ secrets.MAIL_USER }}
        MAIL_PASS: ${{ secrets.MAIL_PASS }}
        TG_BOT_TOKEN: ${{ secrets.MAIL_TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python bot.py
