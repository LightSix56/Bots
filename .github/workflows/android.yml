name: KemonoDroid APK

on:
  push:
    branches: [main, 'ccr-**']
    paths: ['KemonoDroid/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: KemonoDroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK; just accept its licenses so Gradle can fetch missing parts
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        working-directory: .

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KemonoDroid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KemonoDroid-apk
          path: KemonoDroid/KemonoDroid.apk

      # Rolling pre-release so the APK can be downloaded straight from the phone
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kemonodroid-latest --yes --cleanup-tag || true
          gh release create kemonodroid-latest KemonoDroid.apk \
            --prerelease --title "KemonoDroid (latest build)" \
            --notes "Debug APK built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
