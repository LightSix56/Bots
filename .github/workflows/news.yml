name: News digest

on:
  schedule:
    # 12:00 MSK = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # История отправленных новостей хранится в кэше Actions. Раньше seen.json
      # коммитился в main после каждого запуска: 246 из 306 коммитов репозитория
      # были служебными "update seen.json".
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/news_state.json
          key: news-state-${{ github.run_id }}
          restore-keys: |
            news-state-

      - name: Run digest
        env:
          NEWS_TG_BOT_TOKEN: ${{ secrets.NEWS_TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_PATH: data/news_state.json
        run: python news.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/news_state.json
          key: news-state-${{ github.run_id }}
