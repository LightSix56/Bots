name: News digest

on:
  schedule:
    # 12:00 MSK = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python news.py
        env:
          NEWS_TG_BOT_TOKEN: ${{ secrets.NEWS_TG_BOT_TOKEN }}
          NEWS_TG_CHAT_ID: ${{ secrets.NEWS_TG_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.NEWS_TG_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.NEWS_TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}


      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen.json"
          git push

